<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>兼职注册</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .register-page { max-width: 480px; margin: 0 auto; padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; }
    .register-card { background: #fff; border-radius: 16px; padding: 28px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .register-card h2 { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 4px; text-align: center; }
    .register-card .sub { font-size: 13px; color: #999; text-align: center; margin-bottom: 24px; }
    .register-card label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; margin-top: 14px; }
    .register-card select, .register-card input {
      width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none;
      background: #fff; box-sizing: border-box;
    }
    .register-card select:focus, .register-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,108,247,0.1); }
    .register-card .btn { width: 100%; margin-top: 20px; }
    .register-card .error { color: #f44336; font-size: 13px; margin-top: 8px; display: none; }
    .register-card .success { color: #4caf50; font-size: 14px; text-align: center; }
    .register-card .provider-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 13px; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; }
  </style>
</head>
<body class="register-page">
  <div class="register-card" id="formCard">
    <h2>兼职注册</h2>
    <div class="sub" id="providerLabel">加载中...</div>
    <label>选择门店</label>
    <select id="regStore"><option value="">请选择门店</option></select>
    <label>姓名</label>
    <input type="text" id="regName" placeholder="请输入姓名">
    <label>手机号</label>
    <input type="tel" id="regPhone" placeholder="请输入11位手机号（选填）" maxlength="11">
    <p class="error" id="regError"></p>
    <button class="btn-primary btn" onclick="doRegister()">确认注册</button>
  </div>
  <div class="register-card" id="doneCard" style="display:none;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">✅</div>
    <h2>注册成功</h2>
    <p class="success" style="margin-top:8px">你已加入花名册，可以扫码打卡了</p>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script>
  (function() {
    var providerId = getParam('provider');
    if (!providerId) { showError('请扫描正确的注册二维码'); return; }

    var providerName = '';
    var providerRate = 0;

    init();

    function init() {
      db.from('service_provider').select('*').eq('id', providerId).single()
        .then(function(r) {
          if (r.error || !r.data) { showError('第三方不存在'); return; }
          providerName = r.data.name;
          providerRate = r.data.hourly_rate;
          document.getElementById('providerLabel').innerHTML =
            '<span class="provider-tag">' + escHtml(providerName) + '</span>' +
            (providerRate ? ' <span style="font-size:12px;color:#999">服务费 ' + providerRate + '元/h</span>' : '');
          return db.from('store').select('store_id,name').order('store_id');
        }).then(function(r) {
          if (r.error) throw r.error;
          var stores = r.data || [];
          if (stores.length === 0) { showError('暂无可用门店'); return; }
          document.getElementById('regStore').innerHTML =
            '<option value="">请选择门店</option>' +
            stores.map(function(s) { return '<option value="' + s.store_id + '">' + escHtml(s.name) + '</option>'; }).join('');
        }).catch(function(err) {
          showError('加载失败: ' + (err.message || '网络错误'));
        });
    }

    window.doRegister = function() {
      var storeId = document.getElementById('regStore').value;
      var name = document.getElementById('regName').value.trim();
      var phone = document.getElementById('regPhone').value.trim();
      var errEl = document.getElementById('regError');
      errEl.style.display = 'none';
      if (!storeId) { errEl.textContent = '请选择门店'; errEl.style.display = ''; return; }
      if (!name) { errEl.textContent = '请输入姓名'; errEl.style.display = ''; return; }
      if (phone && !/^1\d{10}$/.test(phone)) { errEl.textContent = '手机号格式不正确'; errEl.style.display = ''; return; }
      // 检查是否已在花名册
      db.from('roster').select('id').eq('store_id', storeId).eq('name', name).single()
        .then(function(r) {
          if (r.data) { errEl.textContent = '该姓名在此门店已存在'; errEl.style.display = ''; return Promise.reject('dup'); }
          return db.from('roster').insert({
            store_id: storeId, name: name, phone: phone || null, provider_id: providerId
          });
        }).then(function(res) {
          if (res && res.error) throw res.error;
          document.getElementById('formCard').style.display = 'none';
          document.getElementById('doneCard').style.display = '';
        }).catch(function(e) {
          if (e !== 'dup') { errEl.textContent = '注册失败: ' + (e.message || '网络错误'); errEl.style.display = ''; }
        });
    };

    function showError(msg) {
      document.getElementById('formCard').innerHTML =
        '<div style="text-align:center;padding:40px 0"><div style="font-size:48px;margin-bottom:12px">❌</div>' +
        '<p style="color:#f44336;font-size:15px">' + escHtml(msg) + '</p></div>';
    }

    function getParam(name) {
      return new URLSearchParams(location.search).get(name) || '';
    }

    function escHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
  </script>
</body>
</html>
